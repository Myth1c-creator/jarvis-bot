name: Jarvis bot (cloud)

on:
  schedule:
    # každou hodinu v noci/odpoledne; běh trvá až 5 h 40 min a hlídá si okno 4–16 Praha
    - cron: "0 2-15 * * 1-5"
  workflow_dispatch:

concurrency:
  group: jarvis-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Poslouchej a odpovídej
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 posli_bot.py --sekundy 20400 --okno 4-16

name: Jarvis bot (cloud)

on:
  schedule:
    # každých 10 minut v noci/odpoledne; běh trvá až 5 h 40 min a hlídá si okno 4–17 Praha
    - cron: "*/10 2-16 * * 1-5"
  workflow_dispatch:
    inputs:
      zkouska:
        description: "Zkušební dotaz na model (odešle odpověď a skončí)"
        type: string
        default: ""

concurrency:
  group: jarvis-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Poslouchej a odpovídej
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          ZKOUSKA: ${{ inputs.zkouska }}
        run: |
          if [ -n "$ZKOUSKA" ]; then
            python3 posli_bot.py --zkouska "$ZKOUSKA"
          else
            python3 posli_bot.py --sekundy 20400 --okno 4-17 --diagnostika
          fi

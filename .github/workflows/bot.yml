name: Jarvis bot (cloud)

on:
  schedule:
    # Po–Pá 4:00–16:00 Praha (3:00–15:00 UTC v zimě, 2:00–14:00 v létě)
    - cron: "*/5 2-15 * * 1-5"
  workflow_dispatch:

concurrency:
  group: jarvis-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Poslouchej a odpovídej
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 posli_bot.py --sekundy 280

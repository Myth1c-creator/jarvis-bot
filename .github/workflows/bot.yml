name: Jarvis bot (cloud)

on:
  schedule:
    # Záloha pro případ, že se přetrhne řetězení (viz poslední krok workflow).
    # Řetězení je hlavní: na konci běhu se spustí další, takže cloud poslouchá nepřetržitě.
    - cron: "21 */6 * * *"
  workflow_dispatch:
    inputs:
      zkouska:
        description: "Zkušební dotaz na model (odešle odpověď a skončí)"
        type: string
        default: ""

concurrency:
  group: jarvis-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Poslouchej a odpovídej
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          # PAT slouží i ke čtení srdečního tepu (vyšší limit API než bez tokenu).
          PAT: ${{ secrets.PAT }}
          ZKOUSKA: ${{ inputs.zkouska }}
        run: |
          if [ -n "$ZKOUSKA" ]; then
            python3 posli_bot.py --zkouska "$ZKOUSKA"
          else
            python3 posli_bot.py --sekundy 20400 --okno 0-23 --diagnostika
          fi

      # Řetězení: na konci běhu spustí další, aby cloud poslouchal nepřetržitě.
      # Potřebuje secret PAT (fine-grained token s právem Actions: read and write).
      # Když PAT chybí nebo už nějaký běh čeká ve frontě, nic nespouští –
      # o záskok se postará cron výše.
      - name: Spusť další běh (řetězení)
        if: always() && !inputs.zkouska
        continue-on-error: true
        env:
          PAT: ${{ secrets.PAT }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PAT" ]; then
            echo "Secret PAT není nastavený – řetězení přeskočeno."
            exit 0
          fi
          export GH_TOKEN="$PAT"
          fronta=$(gh api "repos/$REPO/actions/runs?status=queued" --jq '.total_count')
          if [ "$fronta" -gt 0 ]; then
            echo "Ve frontě už čeká $fronta běh(ů) – neřetězím."
            exit 0
          fi
          gh workflow run bot.yml --ref "$GITHUB_REF_NAME"
          echo "Další běh naplánován."
